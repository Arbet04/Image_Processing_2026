<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ทดสอบ AI Service (Forge Neo)</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 20px;
    background: #111;
    color: #eee;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 24px; }
  label { display: block; margin-top: 16px; font-size: 14px; color: #ccc; }
  input[type="text"], textarea, input[type="number"] {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    margin-top: 6px;
    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 6px;
    color: #eee;
    font-size: 14px;
  }
  textarea { min-height: 70px; resize: vertical; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  button {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    background: #f37021;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #555; cursor: not-allowed; }
  #status { margin-top: 14px; font-size: 13px; color: #aaa; min-height: 18px; }
  #status.error { color: #ff6b6b; }
  #result { margin-top: 20px; text-align: center; }
  #result img {
    max-width: 100%;
    border-radius: 8px;
    border: 1px solid #333;
  }
  .config {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid #2a2a2a;
    font-size: 12px;
    color: #777;
  }
</style>
</head>
<body>

  <h1>ทดสอบ AI Service</h1>
  <div class="sub">ยิง request ไปที่ ai-service (ต่อคิวแล้วส่งต่อให้ Forge Neo) — ต้องเปิด Forge Neo + ai-service ทิ้งไว้ทั้งคู่</div>

  <label for="apiUrl">API URL</label>
  <input type="text" id="apiUrl" value="http://127.0.0.1:8001/generate">

  <label for="prompt">Prompt</label>
  <textarea id="prompt" placeholder="เช่น a cute cat sitting on a chair, high quality">a cute cat sitting on a chair, high quality, detailed</textarea>

  <label for="negPrompt">Negative Prompt</label>
  <textarea id="negPrompt" placeholder="เช่น blurry, low quality, extra limbs">blurry, low quality, deformed</textarea>

  <div class="row">
    <div>
      <label for="steps">Sampling Steps</label>
      <input type="number" id="steps" value="20" min="1" max="150">
    </div>
    <div>
      <label for="width">Width</label>
      <input type="number" id="width" value="512" step="64">
    </div>
    <div>
      <label for="height">Height</label>
      <input type="number" id="height" value="512" step="64">
    </div>
  </div>

  <button id="genBtn" onclick="generate()">Generate</button>

  <div id="status"></div>
  <div id="result"></div>

  <div class="config">
    หมายเหตุ: ถ้าเจอ error "Failed to fetch" ให้เช็คว่าเปิด ai-service
    (<code>uvicorn main:app --reload --port 8001</code>) และ Forge Neo
    (พอร์ต 7860) ทิ้งไว้ทั้งคู่หรือยัง
  </div>

<script>
async function generate() {
  const btn = document.getElementById('genBtn');
  const status = document.getElementById('status');
  const result = document.getElementById('result');
  const apiUrl = document.getElementById('apiUrl').value.trim();

  const payload = {
    prompt: document.getElementById('prompt').value,
    negative_prompt: document.getElementById('negPrompt').value,
    steps: parseInt(document.getElementById('steps').value, 10),
    width: parseInt(document.getElementById('width').value, 10),
    height: parseInt(document.getElementById('height').value, 10)
  };

  btn.disabled = true;
  status.className = '';
  status.textContent = 'กำลังส่ง request... (อาจใช้เวลาสักครู่ ขึ้นกับ steps และ GPU)';
  result.innerHTML = '';

  const startTime = Date.now();

  try {
    const res = await fetch(apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (!res.ok || data.success === false) {
      throw new Error(data.detail || data.error || `API ตอบกลับผิดพลาด: ${res.status}`);
    }

    if (!data.image_base64) {
      throw new Error('ไม่พบรูปภาพใน response (เช็คว่า checkpoint โหลดสำเร็จหรือยัง)');
    }

    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    status.textContent = `สำเร็จ ใช้เวลา ${elapsed} วินาที (Forge Neo รายงานว่าใช้ ${data.elapsed_seconds ?? '-'} วินาที)`;

    const img = document.createElement('img');
    img.src = 'data:image/png;base64,' + data.image_base64;
    result.appendChild(img);

  } catch (err) {
    status.className = 'error';
    status.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
  } finally {
    btn.disabled = false;
  }
}
</script>

</body>
</html>
