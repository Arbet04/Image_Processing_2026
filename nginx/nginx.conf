# nginx.conf ตัวอย่างสำหรับโปรเจค Image Genny (ลงที่เครื่อง Frontend)
#
#   Browser -> nginx (port 80) -+-> เสิร์ฟ login.html / index.html / config.js
#                               +-> /api/... ส่งต่อไป Backend (Flask :5000) -> AI Service -> Forge Neo
#
# วิธีใช้: ดูขั้นตอนใน nginx/README.md
# ต้องแก้ 2 จุดให้ตรงกับเครื่องจริง (มีเครื่องหมาย <<< กำกับ): root และ proxy_pass

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        # ถ้า port 80 ถูกโปรแกรมอื่นใช้อยู่ (nginx เปิดไม่ขึ้น) ให้เปลี่ยนเป็น 8080
        listen 80;
        server_name localhost;

        # ---- เสิร์ฟหน้าเว็บ (Checkpoint #3) ----
        # โฟลเดอร์ที่มี login.html, index.html, config.js
        # ใช้ / ไม่ใช่ \ และถ้า path มีช่องว่างต้องครอบด้วย "..."
        root  C:/image-project/frontend;      # <<< แก้ให้ตรงกับเครื่อง
        index login.html;

        # config.js ถูกแก้บ่อย ไม่ให้ browser จำค่าเก่า
        location = /config.js {
            add_header Cache-Control "no-store";
        }

        # ---- Reverse Proxy ไป Backend (Checkpoint #4) ----
        location /api/ {
            # IP เครื่อง Backend — ถ้า Backend อยู่เครื่องเดียวกับ nginx ใช้ http://127.0.0.1:5000
            # ห้ามใส่ / ต่อท้าย ไม่งั้น /api จะถูกตัดออกแล้ว Backend ตอบ 404
            proxy_pass http://172.20.57.86:5000;      # <<< แก้ให้ตรงกับเครื่อง

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # เจนรูปใช้เวลานาน (รวมเวลารอคิว) ค่าเริ่มต้น 60 วินาทีไม่พอ จะได้ 504
            # ตั้งให้เท่ากับ AI_SERVICE_TIMEOUT ของ Backend (600 วินาที)
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # รูปที่ Backend ตอบกลับเป็น base64 ใน JSON (~2 MB) บีบอัดให้ส่งเร็วขึ้น
        gzip on;
        gzip_types application/json application/javascript text/css;
    }
}
