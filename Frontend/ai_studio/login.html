<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio — เข้าสู่ระบบ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0f0f13;
    --surface: #18181f;
    --surface2: #22222c;
    --border: #2e2e3a;
    --accent: #7c6af7;
    --accent2: #a78bfa;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --success: #34d399;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', 'Noto Sans Thai', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }

  .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .auth-screen {
    height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 20%, rgba(124,106,247,.12), transparent 55%), var(--bg);
    padding: 20px;
  }

  .auth-card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }

  .auth-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .auth-logo .logo { width: 40px; height: 40px; font-size: 20px; }
  .auth-logo h1 { font-size: 17px; font-weight: 600; }
  .auth-logo p  { font-size: 12px; color: var(--muted); }

  .auth-tabs {
    display: flex;
    gap: 4px;
    background: var(--bg);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 22px;
  }

  .auth-tab {
    flex: 1;
    padding: 8px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
  }

  .auth-tab.active { background: var(--surface2); color: var(--text); }

  .auth-form { display: none; flex-direction: column; gap: 14px; }
  .auth-form.active { display: flex; }

  .auth-field { display: flex; flex-direction: column; gap: 6px; }
  .auth-field label { font-size: 12px; color: var(--muted); }

  .auth-field input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 11px 14px;
    outline: none;
    transition: border .2s;
  }

  .auth-field input:focus { border-color: var(--accent); }
  .auth-field input::placeholder { color: var(--muted); }

  .auth-submit {
    margin-top: 4px;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
  }

  .auth-submit:hover { opacity: .88; }
  .auth-submit:active { transform: scale(.99); }

  .auth-msg {
    font-size: 12.5px;
    text-align: center;
    min-height: 16px;
  }

  .auth-msg.error { color: #f87171; }
  .auth-msg.success { color: var(--success); }
</style>
</head>
<body>

<div class="auth-screen" id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo">🤖</div>
      <div>
        <h1>AI Studio</h1>
        <p>Chat · Image Generation</p>
      </div>
    </div>

    <div class="auth-tabs" id="auth-tabs">
      <button class="auth-tab active" id="auth-tab-login" onclick="switchAuthTab('login')">เข้าสู่ระบบ</button>
      <button class="auth-tab" id="auth-tab-signup" onclick="switchAuthTab('signup')">สมัครสมาชิก</button>
    </div>

    <!-- LOGIN FORM -->
    <form class="auth-form active" id="login-form" onsubmit="handleLogin(event)">
      <div class="auth-field">
        <label>ชื่อผู้ใช้งาน (Username)</label>
        <input type="text" id="login-username" placeholder="เช่น noon3" required autocomplete="username">
      </div>
      <div class="auth-field">
        <label>รหัสผ่าน</label>
        <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div class="auth-msg" id="login-msg"></div>
      <button type="submit" class="auth-submit">เข้าสู่ระบบ</button>
    </form>

    <!-- SIGNUP FORM -->
    <form class="auth-form" id="signup-form" onsubmit="handleSignup(event)">
      <div class="auth-field">
        <label>ชื่อผู้ใช้งาน (Username)</label>
        <input type="text" id="signup-name" placeholder="เช่น noon4" required autocomplete="name">
      </div>
      <div class="auth-field">
        <label>รหัสผ่าน</label>
        <input type="password" id="signup-password" placeholder="อย่างน้อย 6 ตัวอักษร" required minlength="6" autocomplete="new-password">
      </div>
      <div class="auth-field">
        <label>ยืนยันรหัสผ่าน</label>
        <input type="password" id="signup-confirm" placeholder="••••••••" required minlength="6" autocomplete="new-password">
      </div>
      <div class="auth-msg" id="signup-msg"></div>
      <button type="submit" class="auth-submit">สร้างบัญชี</button>
    </form>
  </div>
</div>

<script>
  const SESSION_KEY = 'aistudio_session';

  function setAuthMsg(id, text, type) {
    const el = document.getElementById(id);
    if (el) {
      el.textContent = text;
      el.className = 'auth-msg ' + (type || '');
    }
  }

  function switchAuthTab(tab) {
    document.getElementById('auth-tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('auth-tab-signup').classList.toggle('active', tab === 'signup');
    document.getElementById('login-form').classList.toggle('active', tab === 'login');
    document.getElementById('signup-form').classList.toggle('active', tab === 'signup');
    setAuthMsg('login-msg', '');
    setAuthMsg('signup-msg', '');
  }

  async function handleSignup(e) {
    e.preventDefault();
    const name = document.getElementById('signup-name').value.trim();
    const password = document.getElementById('signup-password').value;
    const confirm = document.getElementById('signup-confirm').value;

    if (password !== confirm) {
      setAuthMsg('signup-msg', 'รหัสผ่านไม่ตรงกัน', 'error');
      return;
    }

    try {
      const response = await fetch('http://10.192.0.121:5000/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: name, password: password })
      });

      const data = await response.json();

      if (response.ok) {
        setAuthMsg('signup-msg', '✅ สร้างบัญชีสำเร็จ! กรุณาเข้าสู่ระบบ', 'success');
        setTimeout(() => {
          switchAuthTab('login');
          document.getElementById('login-username').value = name;
          document.getElementById('login-password').value = '';
        }, 1000);
      } else {
        setAuthMsg('signup-msg', '❌ ' + (data.message || 'สมัครสมาชิกไม่สำเร็จ'), 'error');
      }
    } catch (error) {
      setAuthMsg('signup-msg', '❌ ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ Backend ได้', 'error');
    }
  }

  async function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;

    try {
      const response = await fetch('http://10.192.0.121:5000/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      });

      const data = await response.json();

      if (response.ok) {
        setAuthMsg('login-msg', '✅ เข้าสู่ระบบสำเร็จ', 'success');
        localStorage.setItem(SESSION_KEY, JSON.stringify(data));
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 500);
      } else {
        setAuthMsg('login-msg', '❌ ' + (data.message || 'ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง'), 'error');
      }
    } catch (error) {
      setAuthMsg('login-msg', '❌ ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ Backend ได้', 'error');
    }
  }
</script>
</body>
</html>
