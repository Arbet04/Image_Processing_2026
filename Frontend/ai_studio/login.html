<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Genny — เข้าสู่ระบบ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #17130f;
    --surface: #1d1812;
    --surface2: #221b14;
    --line: #3c3223;
    --line-soft: #2a2318;
    --brass: #8fcfe8;
    --brass-deep: #63a9c7;
    --text: #f1e9dc;
    --muted: #a8977f;
    --muted2: #6e6150;
    --error: #d9704f;
    --success: #7fa87a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Work Sans', 'Noto Sans Thai', sans-serif;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(143,207,232,0.10) 1px, transparent 0);
    background-size: 26px 26px;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .auth-screen {
    padding: 20px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .auth-card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-top: 3px solid var(--brass);
    padding: 38px 32px 32px;
  }

  .auth-logo {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 30px;
  }

  .logo {
    flex-shrink: 0;
    width: 40px; height: 40px;
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
  }

  .auth-logo h1 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 21px;
    letter-spacing: 0.2px;
  }
  .auth-logo p  { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

  .auth-tabs {
    display: flex;
    border: 1px solid var(--line);
    margin-bottom: 28px;
  }

  .auth-tab {
    flex: 1;
    padding: 9px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 13.5px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    transition: background .15s, color .15s;
  }

  .auth-tab + .auth-tab { border-left: 1px solid var(--line); }

  .auth-tab:hover { color: var(--text); }

  .auth-tab.active {
    color: var(--bg);
    background: var(--brass);
  }

  .auth-form { display: none; flex-direction: column; gap: 17px; }
  .auth-form.active { display: flex; }

  .auth-field { display: flex; flex-direction: column; gap: 7px; }
  .auth-field label { font-size: 12.5px; color: var(--muted); }

  .auth-field input {
    background: var(--surface2);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: inherit;
    font-size: 14.5px;
    padding: 11px 13px;
    outline: none;
    transition: border-color .15s;
  }

  .auth-field input:focus { border-color: var(--brass); }
  .auth-field input::placeholder { color: var(--muted2); }

  .auth-submit {
    margin-top: 8px;
    padding: 13px;
    border: 1px solid var(--brass);
    background: var(--brass);
    color: var(--bg);
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }

  .auth-submit:hover { background: var(--brass-deep); border-color: var(--brass-deep); }

  .auth-msg {
    font-size: 12.5px;
    text-align: center;
    min-height: 16px;
    margin-top: -8px;
  }

  .auth-msg.error { color: var(--error); }
  .auth-msg.success { color: var(--success); }
</style>
</head>
<body>

<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo">
        <svg width="21" height="21" viewBox="0 0 21 21" fill="none">
          <rect x="1.5" y="3.5" width="18" height="14" stroke="#8fcfe8" stroke-width="1"/>
          <circle cx="6.3" cy="8" r="1.7" stroke="#8fcfe8" stroke-width="1"/>
          <path d="M1.5 14.5 L7 10.5 L11 13.5 L14.5 10.8 L19.5 15" stroke="#8fcfe8" stroke-width="1"/>
          <path d="M16 1 L16.8 2.7 L18.5 3.5 L16.8 4.3 L16 6 L15.2 4.3 L13.5 3.5 L15.2 2.7 Z" fill="#8fcfe8"/>
        </svg>
      </div>
      <div>
        <h1>Image Genny</h1>
        <p>สร้างสรรค์ภาพด้วยพลัง AI</p>
      </div>
    </div>

    <div class="auth-tabs" id="auth-tabs">
      <button class="auth-tab active" id="auth-tab-login" onclick="switchAuthTab('login')">เข้าสู่ระบบ</button>
      <button class="auth-tab" id="auth-tab-signup" onclick="switchAuthTab('signup')">สมัครสมาชิก</button>
    </div>

    <!-- LOGIN FORM -->
    <form class="auth-form active" id="login-form" onsubmit="handleLogin(event)">
      <div class="auth-field">
        <label>ชื่อผู้ใช้งาน</label>
        <input type="text" id="login-username" placeholder="Username" required autocomplete="username">
      </div>
      <div class="auth-field">
        <label>รหัสผ่าน</label>
        <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div class="auth-msg" id="login-msg"></div>
      <button type="submit" class="auth-submit">เข้าสู่ระบบ</button>
    </form>

    <!-- SIGNUP FORM -->
    <form class="auth-form" id="signup-form" onsubmit="handleSignup(event)">
      <div class="auth-field">
        <label>ชื่อผู้ใช้งาน</label>
        <input type="text" id="signup-name" placeholder="Username" required autocomplete="name">
      </div>
      <div class="auth-field">
        <label>รหัสผ่าน</label>
        <input type="password" id="signup-password" placeholder="อย่างน้อย 6 ตัวอักษร" required minlength="6" autocomplete="new-password">
      </div>
      <div class="auth-field">
        <label>ยืนยันรหัสผ่าน</label>
        <input type="password" id="signup-confirm" placeholder="••••••••" required minlength="6" autocomplete="new-password">
      </div>
      <div class="auth-msg" id="signup-msg"></div>
      <button type="submit" class="auth-submit">สร้างบัญชี</button>
    </form>
  </div>
</div>

<script src="config.js"></script>
<script>

  function setAuthMsg(id, text, type) {
    const el = document.getElementById(id);
    if (el) {
      el.textContent = text;
      el.className = 'auth-msg ' + (type || '');
    }
  }

  function switchAuthTab(tab) {
    document.getElementById('auth-tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('auth-tab-signup').classList.toggle('active', tab === 'signup');
    document.getElementById('login-form').classList.toggle('active', tab === 'login');
    document.getElementById('signup-form').classList.toggle('active', tab === 'signup');
    setAuthMsg('login-msg', '');
    setAuthMsg('signup-msg', '');
  }

  async function handleSignup(e) {
    e.preventDefault();
    const name = document.getElementById('signup-name').value.trim();
    const password = document.getElementById('signup-password').value;
    const confirm = document.getElementById('signup-confirm').value;

    if (password !== confirm) {
      setAuthMsg('signup-msg', 'รหัสผ่านไม่ตรงกัน', 'error');
      return;
    }

    try {
      const response = await fetch(BACKEND_URL + '/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: name, password: password })
      });

      const data = await response.json();

      if (response.ok) {
        setAuthMsg('signup-msg', 'สร้างบัญชีสำเร็จ กรุณาเข้าสู่ระบบ', 'success');
        setTimeout(() => {
          switchAuthTab('login');
          document.getElementById('login-username').value = name;
          document.getElementById('login-password').value = '';
        }, 1000);
      } else {
        setAuthMsg('signup-msg', data.error || 'สมัครสมาชิกไม่สำเร็จ', 'error');
      }
    } catch (error) {
      setAuthMsg('signup-msg', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ Backend ได้', 'error');
    }
  }

  async function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;

    try {
      const response = await fetch(BACKEND_URL + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      });

      const data = await response.json();

      if (response.ok) {
        setAuthMsg('login-msg', 'เข้าสู่ระบบสำเร็จ', 'success');
        localStorage.setItem(SESSION_KEY, JSON.stringify(data));
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 500);
      } else {
        setAuthMsg('login-msg', data.error || 'ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง', 'error');
      }
    } catch (error) {
      setAuthMsg('login-msg', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ Backend ได้', 'error');
    }
  }
</script>
</body>
</html>
